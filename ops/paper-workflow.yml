# Install in the PRIVATE journal repository only. The application revision is pinned at deployment.
name: 模拟账户
on:
  schedule:
    - cron: '23 9,12 * * 1-5'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, run, start, pause, sync]
        default: verify
      market:
        type: choice
        options: [both, A, HK]
        default: both
      watchlist:
        description: '仅供网站的同步关注列表操作'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: paper-ledger
  queue: max
jobs:
  journal:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main # Read the latest journal after waiting for the lock, not the old dispatch SHA.
          path: journal
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Oliver0190/stock-research-web
          ref: __APPLICATION_SHA__
          persist-credentials: false
          path: app
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check -q -r app/requirements.lock.txt
      - name: 检查两地交易日历并处理账户
        working-directory: app
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OP: ${{ inputs.operation || 'run' }}
          MARKET: ${{ inputs.market || 'both' }}
          PAPER_WATCHLIST: ${{ inputs.watchlist }}
          PAPER_JOB_RESULT: ${{ runner.temp }}/paper-result
        run: python -m backend.cloud_job "$OP" ../journal/state --market "$MARKET"
      - name: 保存私有账本
        working-directory: journal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state
          if ! git diff --cached --quiet; then
            git commit -m "Record paper session ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:main
          fi
      - name: 验证本轮结果
        run: test "$(cat "$RUNNER_TEMP/paper-result")" = ok
