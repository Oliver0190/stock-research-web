name: Morning Brief

on:
  # 飞书推送于 2026-09-10 停用，准备迁移至网站。
  # 保留手动入口供历史查看；任务禁用，手动触发也不会发送消息。
  workflow_dispatch:

jobs:
  brief:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore state.json from cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: stock-agent-state-${{ github.run_id }}
          restore-keys: |
            stock-agent-state-
      - run: pip install -r requirements.txt
      - name: Run morning brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TZ: Asia/Hong_Kong
          DATA_SOURCE: akshare
        run: python -m src.jobs morning
