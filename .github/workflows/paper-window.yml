name: Paper trading window
on:
  workflow_call:
    inputs:
      window:
        required: true
        type: string
    secrets:
      PAPER_JOURNAL_DEPLOY_KEY:
        required: true
      DEEPSEEK_API_KEY:
        required: true
    outputs:
      resume_afternoon:
        value: ${{ jobs.session.outputs.resume_afternoon }}
permissions:
  contents: read
jobs:
  session:
    outputs:
      resume_afternoon: ${{ steps.watch.outputs.resume_afternoon }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Oliver0190/stock-paper-runtime
          ref: main
          ssh-key: ${{ secrets.PAPER_JOURNAL_DEPLOY_KEY }}
          path: journal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q -r requirements.lock.txt
      - name: Run session and checkpoint the private journal
        id: watch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WINDOW: ${{ inputs.window }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo "::error::Missing model secret"; exit 1; fi
          python -m backend.cloud_sessions "$WINDOW" journal
