name: 盘中模拟实验
on:
  schedule:
    - cron: '13 1 * * 1-5'
    - cron: '43 4 * * 1-5'
    - cron: '47 8 * * 1-5'
  workflow_dispatch:
    inputs:
      window:
        description: 'auto 按当前交易时段运行，check 验证连接和研究资料'
        type: choice
        options: [auto, check, close]
        default: auto
permissions:
  contents: read
concurrency:
  group: private-paper-forward-test
  queue: max
jobs:
  session:
    if: github.repository == 'Oliver0190/stock-research-web' && github.ref == 'refs/heads/main' && !github.event.repository.private && vars.PAPER_SESSIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Oliver0190/stock-paper-runtime
          ref: main
          ssh-key: ${{ secrets.PAPER_JOURNAL_DEPLOY_KEY }}
          path: journal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q -r requirements.lock.txt
      - name: Run session and checkpoint the private journal
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WINDOW: ${{ inputs.window || (github.event.schedule == '13 1 * * 1-5' && 'morning') || (github.event.schedule == '43 4 * * 1-5' && 'afternoon') || 'close' }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo "::error::Missing model secret"; exit 1; fi
          python -m backend.cloud_sessions "$WINDOW" journal
